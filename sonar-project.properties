# Configuración de SonarCloud para PropTrack.
# sonar.projectKey y sonar.organization los asigna SonarCloud al importar
# el repo (Settings del proyecto en sonarcloud.io) — reemplazá los valores
# de abajo por los reales si son distintos.
sonar.projectKey=Dariel190831_Prop-Track-
sonar.organization=dariel190831

sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# Vendor/generado, build output y binarios: no son código propio a analizar.
# (bare "support.js" no bastaba para excluirlo; con **/ al frente sí matchea)
# .thumbnail: miniatura binaria (WebP) generada por una herramienta, sin
# extension, que el scanner intenta leer como texto UTF-8 y tira warning
# de encoding. **/*.sql: migraciones de Postgres que Sonar detecta como
# PLSQL (Oracle) y no tiene sentido configurarles un Data Dictionary de
# Oracle para 4 reglas que no aplican a este motor de base de datos.
sonar.exclusions=node_modules/**,dist/**,coverage/**,uploads/**,public/icons/**,**/support.js,package-lock.json,**/*.png,**/*.svg,**/*.json,.thumbnail,**/*.sql

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# La cobertura de tests (vitest) esta acotada a src/**/*.js a proposito (ver
# ADR-002): PropTrack.dc.html es el prototipo de un solo archivo, no tiene
# pruebas unitarias. Sin esto, el Quality Gate exige 80% de cobertura sobre
# codigo nuevo que nunca fue pensado para testearse asi.
# src/App.jsx entra en el mismo caso: es solo el iframe que monta el
# prototipo (sin logica de negocio propia), y el include de vitest
# (src/**/*.js) ya lo deja fuera del reporte de lcov a proposito.
sonar.coverage.exclusions=PropTrack.dc.html,mapa.html,src/App.jsx,api/**,supabase/**,public/**,test/**,*.config.js
