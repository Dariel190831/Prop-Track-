name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Los "if:" de un step no pueden referenciar secrets.* directo (GitHub
      # lo rechaza como workflow invalido); se pasa por una env var primero.
      SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el blame

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN_PRESENT == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
