name: CI
# Pipeline as code: este archivo vive versionado en el repo (no en un
# servidor aparte), viaja en cada PR y corre en una maquina limpia por
# ejecucion (runs-on: ubuntu-latest) para evitar el "en mi maquina funciona".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Los "if:" de un step no pueden referenciar secrets.* directo (GitHub
      # lo rechaza como workflow invalido); se pasa por una env var primero.
      SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el blame

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: evita que un paquete comprometido corra codigo
      # arbitrario durante el install (supply-chain). Probado sin romper
      # el build (esbuild no depende de su postinstall para funcionar).
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests + cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN_PRESENT == 'true' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
