<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de propiedades</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#F4F0E8; font-family:"Work Sans", system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .leaflet-container { background:#E8E2D6; font-family:"Work Sans", sans-serif; }
  .leaflet-control-attribution { font-size:9px; background:rgba(251,249,245,.8); }
  .pin {
    display:flex; align-items:center; gap:6px; padding:5px 10px 5px 6px;
    background:#FBF9F5; border:1px solid rgba(20,33,43,.14); border-radius:999px;
    box-shadow:0 4px 14px rgba(20,33,43,.16); white-space:nowrap; cursor:pointer;
    font-family:"JetBrains Mono", monospace; font-size:11px; font-weight:500; color:#14212B;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .pin:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(20,33,43,.22); }
  .pin .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .pin.is-active { background:#14212B; color:#F4F0E8; border-color:#14212B; }
  .leaflet-popup-content-wrapper { border-radius:12px; box-shadow:0 10px 30px rgba(20,33,43,.2); }
  .leaflet-popup-content { margin:14px 16px; font-family:"Work Sans", sans-serif; }
  .pop-t { font-family:"Newsreader", serif; font-size:17px; font-weight:600; color:#14212B; margin-bottom:2px; }
  .pop-s { font-size:12px; color:#6B7480; }
  .pop-p { margin-top:8px; font-family:"JetBrains Mono", monospace; font-size:14px; color:#8A5E1F; }
  .leaflet-bar a { color:#14212B; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const props = [
  { id:1, t:"Casa Residencial Los Andes", z:"Col. Los Andes", p:"L. 3,850,000", tipo:"Casa", est:"Disponible", ll:[14.0938,-87.2075] },
  { id:2, t:"Apartamento Torre Aria", z:"Lomas del Guijarro", p:"L. 2,150,000", tipo:"Apartamento", est:"Negociando", ll:[14.0872,-87.1780] },
  { id:3, t:"Casa Colonia Trejo", z:"Col. Trejo", p:"L. 1,980,000", tipo:"Casa", est:"Disponible", ll:[14.0965,-87.2170] },
  { id:4, t:"Local comercial Río de Piedras", z:"Río de Piedras", p:"L. 4,400,000", tipo:"Local", est:"Vendida", ll:[14.0805,-87.1990] },
  { id:5, t:"Terreno El Hatillo", z:"El Hatillo", p:"L. 950,000", tipo:"Terreno", est:"Disponible", ll:[14.1355,-87.2015] },
  { id:6, t:"Apartamento Palmira 402", z:"Col. Palmira", p:"L. 2,650,000", tipo:"Apartamento", est:"Disponible", ll:[14.0993,-87.1930] }
];
const color = { Disponible:"#3E7C6B", Negociando:"#C08A3E", Vendida:"#B4553C" };

const map = L.map('map', { zoomControl:true, scrollWheelZoom:true }).setView([14.0975,-87.1985], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

const markers = {};
props.forEach(p => {
  const html = `<div class="pin" data-id="${p.id}"><span class="dot" style="background:${color[p.est]}"></span>${p.p}</div>`;
  const m = L.marker(p.ll, { icon: L.divIcon({ html, className:'', iconSize:null, iconAnchor:[0,0] }) }).addTo(map);
  m.bindPopup(`<div class="pop-t">${p.t}</div><div class="pop-s">${p.tipo} · ${p.z} · ${p.est}</div><div class="pop-p">${p.p}</div>`);
  markers[p.id] = m;
});

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'focus' && markers[d.id]) {
    map.flyTo(markers[d.id].getLatLng(), 15, { duration:.7 });
    markers[d.id].openPopup();
  }
  if (d.type === 'reset') { map.flyTo([14.0975,-87.1985], 13, { duration:.6 }); map.closePopup(); }
});
</script>
</body>
</html>
